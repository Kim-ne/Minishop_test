name: Test CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  APP_ENV: 'testing'
  DB_CONNECTION: 'sqlite'

jobs:
  job-name:
    name: Test PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [8.2, 8.3, 8.4]

    steps:
      - name: Step 1
        uses: actions/checkout@v4

      - name: Step 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2

      - name: Step 3
        uses: actions/cache@v4
        id: generate-cache
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
              ${{ runner.os }}-php-${{ matrix.php-versions }}-composer-

      - name: Check cache
        run: |
            echo "cache-hit= ${{ steps.generate-cache.outputs.cache-hit }}"

      - name: Step 4
        if: steps.generate-cache.outputs.cache-hit != 'true'
        run: |
            start=$(date +%s)
            composer install --no-interaction --prefer-dist --optimize-autoloader
            end=$(date +%s)
            echo "Time taken: $((end-start)) seconds"

      - name: Step 5
        run: cp ./.env.example ./.env

      - name: Step 6
        run: touch database/database.sqlite

      - name: Step 7
        run: php artisan key:generate

      - name: Step 8
        run: php artisan migrate --force

      - name: Step 9
        run: php artisan test
